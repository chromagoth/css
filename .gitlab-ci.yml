workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

stages:
  - lint
  - build
  - publish

include:
  - component: $CI_SERVER_FQDN/patrick.pfenning.92/ci-templates/security@0.6.0

.chromagoth-binary:
  image:
    name: quay.io/buildah/stable:v1.42.0
    entrypoint: [""]
  before_script:
    - buildah login --username $CI_REGISTRY_USER --password $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - ctr=$(buildah from registry.gitlab.com/patrick.pfenning.92/chromagoth/palettes:main)
    - mnt=$(buildah mount "$ctr")
    - cp "$mnt/chromagoth" /usr/local/bin/chromagoth
    - buildah umount "$ctr"
    - buildah rm "$ctr"
    - chmod +x /usr/local/bin/chromagoth

build:
  extends: .chromagoth-binary
  stage: build
  script:
    - chromagoth render
  artifacts:
    paths:
      - dist/

publish:npm:
  stage: publish
  image: node:lts-alpine
  needs: [build]
  before_script:
    - corepack enable
    - printf '@chromagoth:registry=https://%s/api/v4/packages/npm/\n' "$CI_SERVER_HOST" > .npmrc
    - printf '//%s/api/v4/packages/npm/:_authToken=%s\n' "$CI_SERVER_HOST" "$CI_JOB_TOKEN" >> .npmrc
    - VERSION="${CI_COMMIT_TAG#v}" && pnpm version --no-git-tag-version "$VERSION"
  script:
    - pnpm publish --no-git-checks --ignore-scripts
  rules:
    - if: $CI_COMMIT_TAG
