workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

stages:
  - test
  - lint
  - build
  - publish

include:
  - component: $CI_SERVER_FQDN/patrick.pfenning.92/ci-templates/pre-commit@0.6.0
  - component: $CI_SERVER_FQDN/patrick.pfenning.92/ci-templates/security@0.6.0

validate:tag:
  stage: .pre
  image: alpine:latest
  script:
    - |
      if ! printf '%s' "$CI_COMMIT_TAG" | grep -qE '^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}\.[0-9]+(-[a-zA-Z0-9][a-zA-Z0-9.-]*)?$'; then
        printf 'ERROR: tag "%s" must match YYYY.M.D.N[-suffix]\n' "$CI_COMMIT_TAG"
        exit 1
      fi
  rules:
    - if: $CI_COMMIT_TAG

build:
  image:
    name: registry.gitlab.com/patrick.pfenning.92/chromagoth/palettes:main
    entrypoint: [""]
  stage: build
  script:
    - chromagoth render
  artifacts:
    paths:
      - dist/

.npm-auth:
  stage: publish
  image: node:lts-alpine
  needs: [build]
  before_script:
    - corepack enable
    - printf '@chromagoth:registry=https://%s/api/v4/packages/npm/\n' "$CI_SERVER_HOST" > .npmrc
    - printf '//%s/api/v4/packages/npm/:_authToken=%s\n' "$CI_SERVER_HOST" "$CI_JOB_TOKEN" >> .npmrc

publish:npm:nightly:
  extends: .npm-auth
  before_script:
    - !reference [.npm-auth, before_script]
    - npm pkg set version="0.0.0-nightly.$(date -u +%Y%m%d%H%M%S)"
  script:
    - pnpm publish --no-git-checks --ignore-scripts --tag nightly
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

publish:npm:dev:
  extends: .npm-auth
  before_script:
    - !reference [.npm-auth, before_script]
    - npm pkg set version="0.0.0-dev.$CI_COMMIT_SHORT_SHA"
  script:
    - pnpm publish --no-git-checks --ignore-scripts --tag dev
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - if: $RELEASE_DEV == "true"
    - when: manual

publish:npm:
  extends: .npm-auth
  before_script:
    - !reference [.npm-auth, before_script]
    - |
      _t="$CI_COMMIT_TAG"
      _y="${_t%%.*}"; _r="${_t#*.}"
      _m="${_r%%.*}"; _r="${_r#*.}"
      _d="${_r%%.*}"; _r="${_r#*.}"
      npm pkg set version="${_y}.$((10#$_m * 100 + 10#$_d)).${_r}"
  script:
    - |
      if printf '%s' "$CI_COMMIT_TAG" | grep -q -- '-'; then
        pnpm publish --no-git-checks --ignore-scripts --tag rc
      else
        pnpm publish --no-git-checks --ignore-scripts --tag latest
      fi
  rules:
    - if: '$CI_COMMIT_TAG =~ /^[0-9]{4}\.[0-9]+\.[0-9]+\.[0-9]+-/'
    - if: $CI_COMMIT_TAG
      when: manual
